<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Sorğu</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #171717;
      --border: #262626;
      --border-hover: #333;
      --text: #e8e8e8;
      --muted: #666;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --blue: #60a5fa;
      --orange: #fb923c;
    }

    [data-theme="light"] {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #e0e0da;
      --border-hover: #c8c8c0;
      --text: #1a1a1a;
      --muted: #999;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #d97706;
      --blue: #2563eb;
      --orange: #ea580c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap { width: 100%; max-width: 540px; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .logo-text { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
    .admin-badge { margin-left: auto; font-size: 11px; background: rgba(251,146,60,.1); color: var(--orange); border: 1px solid rgba(251,146,60,.3); padding: 3px 9px; border-radius: 6px; font-weight: 500; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 2rem 0; }
    .error-state { text-align: center; color: var(--red); font-size: 14px; padding: 2rem 0; }

    #authCard, #deniedCard { text-align: center; padding: 3rem 1rem; }
    #authCard p, #deniedCard p { color: var(--muted); font-size: 14px; margin-bottom: 1.25rem; }
    .btn { display: inline-block; padding: 9px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { opacity: .85; }

    .task-title { font-size: 20px; font-weight: 400; margin-bottom: 1rem; line-height: 1.3; }

    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 500; }
    .not-started { background: rgba(128,128,128,.06); color: var(--muted); border: 1px solid var(--border); }
    .in-progress { background: rgba(96,165,250,.1); color: var(--blue); border: 1px solid rgba(96,165,250,.3); }
    .done { background: rgba(74,222,128,.1); color: var(--green); border: 1px solid rgba(74,222,128,.3); }
    .on-hold { background: rgba(128,128,128,.04); color: var(--muted); border: 1px solid var(--border); }
    .cancelled { background: rgba(248,113,113,.08); color: var(--red); border: 1px solid rgba(248,113,113,.2); }

    .custom-select { position: relative; display: inline-block; }
    .custom-select-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
      font-family: inherit; cursor: pointer; border: 1px solid; user-select: none;
      transition: opacity .15s;
    }
    .custom-select-btn:hover { opacity: .85; }
    .custom-select-btn svg { flex-shrink: 0; }
    .custom-select-btn.not-started { background: rgba(128,128,128,.06); color: var(--muted); border-color: var(--border); }
    .custom-select-btn.in-progress { background: rgba(96,165,250,.1); color: var(--blue); border-color: rgba(96,165,250,.3); }
    .custom-select-btn.in-review   { background: rgba(96,165,250,.1); color: var(--blue); border-color: rgba(96,165,250,.3); }
    .custom-select-btn.done        { background: rgba(74,222,128,.1); color: var(--green); border-color: rgba(74,222,128,.3); }
    .custom-select-btn.on-hold     { background: rgba(128,128,128,.04); color: var(--muted); border-color: var(--border); }
    .custom-select-btn.cancelled   { background: rgba(248,113,113,.08); color: var(--red); border-color: rgba(248,113,113,.2); }

    .custom-select-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; z-index: 100; min-width: 160px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .custom-select-dropdown.open { display: block; }
    .custom-select-option {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; font-size: 13px; cursor: pointer;
      transition: background .1s; font-family: inherit;
    }
    .custom-select-option:hover { background: rgba(255,255,255,.05); }
    [data-theme="light"] .custom-select-option:hover { background: rgba(0,0,0,.04); }
    .custom-select-option .opt-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .opt-not-started { background: var(--muted); }
    .opt-in-progress { background: var(--blue); }
    .opt-done        { background: var(--green); }
    .opt-on-hold     { background: var(--muted); }
    .opt-cancelled   { background: var(--red); }

    .divider { height: 1px; background: var(--border); margin: 1rem 0; }
    .meta { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
    .meta-label { color: var(--muted); }

    .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }

    .messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; min-height: 60px; max-height: 400px; overflow-y: auto; scroll-behavior: smooth; }
    .msg-row { display: flex; flex-direction: column; gap: 3px; }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.theirs { align-items: flex-start; }

    .bubble { padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
    .bubble.mine { background: rgba(251,146,60,.12); color: var(--orange); border: 1px solid rgba(251,146,60,.2); border-bottom-right-radius: 3px; }
    .bubble.theirs { background: rgba(128,128,128,.1); color: var(--text); border-bottom-left-radius: 3px; }

    .msg-meta { font-size: 11px; color: var(--muted); padding: 0 4px; }
    .msg-who { color: var(--orange); }
    .msg-who-user { color: var(--muted); }

    .tr-btn {
      background: none; border: none; padding: 0;
      font-family: 'DM Sans', sans-serif; font-size: 11px;
      color: var(--muted); cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px;
      transition: color .15s;
    }
    .tr-btn:hover { color: var(--text); }
    .tr-btn:disabled { cursor: default; text-decoration: none; opacity: .7; }
    .no-messages { font-size: 13px; color: var(--muted); text-align: center; padding: 1rem 0; }

    .input-row { display: flex; gap: 8px; }
    .msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border-color .15s;
    }
    .msg-input:focus { border-color: var(--border-hover); }
    .msg-input::placeholder { color: var(--muted); }

    .send-btn {
      padding: 9px 16px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .send-btn:hover { opacity: .88; }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }

    .send-error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; }
    .send-error.visible { display: block; }

    .tracking-id { font-size: 11px; color: var(--muted); margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); font-family: monospace; }
    .back-link { display: inline-block; margin-top: 1.5rem; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .15s; }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Support Panel</span>
      <span class="admin-badge">Admin</span>
    </div>

    <div class="card" id="authCard" style="display:none">
      <p>Bu səhifə yalnız adminlər üçündür.</p>
      <button class="btn btn-primary" id="signInBtn">Daxil ol</button>
    </div>

    <div class="card" id="deniedCard" style="display:none">
      <p>Bu səhifəyə girişiniz yoxdur.</p>
      <a href="/" class="btn btn-primary" style="text-decoration:none">Ana səhifəyə qayıt</a>
    </div>

    <div id="mainContent" style="display:none">
      <div class="card" id="statusCard">
        <div class="loading">Yüklənir...</div>
      </div>

      <div class="card" id="chatCard" style="display:none">
        <div class="section-label">Mesajlar</div>
        <div class="messages" id="messages">
          <div class="no-messages">Hələ mesaj yoxdur</div>
        </div>
        <div class="input-row">
          <input class="msg-input" id="msgInput" placeholder="Samir adından cavab yaz..." onkeydown="handleKey(event)" />
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">Göndər</button>
        </div>
        <div class="send-error" id="sendError"></div>
      </div>

      <div class="tracking-id" id="trackingIdLabel" style="display:none"></div>
      <a href="/admin" class="back-link">← Admin panelə qayıt</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const trackingId = params.get('id');
    let lastCommentCount = -1;
    let authToken = null;

    const VALID_STATUSES = ['Not started', 'On Hold', 'In progress', 'In Review', 'Done', 'Cancelled'];
    const statusMap = {
      'Not started': { label: 'Başlanmayıb', cls: 'not-started', icon: '○' },
      'In progress': { label: 'İcrada', cls: 'in-progress', icon: '◑' },
      'In Review':   { label: 'Yoxlanılır', cls: 'in-progress', icon: '◑' },
      'Done':        { label: 'Tamamlandı', cls: 'done', icon: '●' },
      'On Hold':     { label: 'Gözləmədə', cls: 'on-hold', icon: '◌' },
      'Cancelled':   { label: 'Ləğv edildi', cls: 'cancelled', icon: '✕' },
    };
    const priorityLabels = { High: '🔴 Yüksək', Medium: '🟡 Orta', Low: '🟢 Aşağı' };
    const priorityCls = { High: 'var(--red)', Medium: 'var(--yellow)', Low: 'var(--green)' };

    function formatDate(d) {
      if (!d) return null;
      return new Date(d).toLocaleDateString('az-AZ', { day:'2-digit', month:'2-digit', year:'numeric' });
    }
    function formatTime(d) {
      if (!d) return '';
      return new Date(d).toLocaleTimeString('az-AZ', { hour:'2-digit', minute:'2-digit' });
    }
    function escHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let currentPageId = null;

    async function loadStatus() {
      const card = document.getElementById('statusCard');
      if (!trackingId) { card.innerHTML = '<div class="error-state">Tracking ID tapılmadı</div>'; return; }

      try {
        const res = await fetch('/api/track?id=' + trackingId);
        const data = await res.json();

        if (!data.success) { card.innerHTML = '<div class="error-state">' + (data.error || 'Sorğu tapılmadı') + '</div>'; return; }

        currentPageId = data.pageId || null;
        const st = statusMap[data.status] || { label: data.status, cls: 'not-started', icon: '○' };

        const optDotCls = { 'Not started':'opt-not-started','In progress':'opt-in-progress','In Review':'opt-in-progress','Done':'opt-done','On Hold':'opt-on-hold','Cancelled':'opt-cancelled' };
        const statusOptions = VALID_STATUSES.filter(s => s !== data.status).map(s =>
          `<div class="custom-select-option" onclick="selectStatus('${s}')">` +
          `<span class="opt-dot ${optDotCls[s] || 'opt-not-started'}"></span>${statusMap[s]?.label || s}</div>`
        ).join('');

        card.innerHTML =
          '<div class="task-title">' + escHtml(data.taskName) + '</div>' +
          '<div class="status-row">' +
            '<div class="custom-select" id="statusDropdown">' +
              '<div class="custom-select-btn ' + st.cls + '" onclick="toggleDropdown()">' +
                st.icon + ' ' + st.label +
                '<svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor" opacity=".5"><path d="M0 0l5 6 5-6z"/></svg>' +
              '</div>' +
              '<div class="custom-select-dropdown" id="statusOptions">' + statusOptions + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="divider"></div>' +
          (data.requester ? '<div class="meta"><span class="meta-label">Göndərən</span><span>' + escHtml(data.requester) + '</span></div>' : '') +
          (data.priority ? '<div class="meta"><span class="meta-label">Prioritet</span><span style="color:' + (priorityCls[data.priority] || 'var(--text)') + '">' + (priorityLabels[data.priority] || data.priority) + '</span></div>' : '') +
          (data.dueDate ? '<div class="meta"><span class="meta-label">Son tarix</span><span>' + formatDate(data.dueDate) + '</span></div>' : '') +
          '<div class="meta"><span class="meta-label">Göndərildi</span><span>' + formatDate(data.createdTime) + '</span></div>';

        document.getElementById('chatCard').style.display = 'block';
        document.getElementById('trackingIdLabel').style.display = 'block';
        document.getElementById('trackingIdLabel').textContent = 'ID: ' + trackingId;
      } catch (err) {
        card.innerHTML = '<div class="error-state">Bağlantı xətası</div>';
      }
    }

    function toggleDropdown() {
      document.getElementById('statusOptions')?.classList.toggle('open');
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#statusDropdown')) {
        document.getElementById('statusOptions')?.classList.remove('open');
      }
    });

    async function selectStatus(status) {
      document.getElementById('statusOptions')?.classList.remove('open');
      if (!currentPageId) return;

      const st = statusMap[status] || { label: status, cls: 'not-started', icon: '○' };
      const btn = document.querySelector('.custom-select-btn');
      if (btn) {
        btn.className = 'custom-select-btn ' + st.cls;
        btn.innerHTML = st.icon + ' ' + st.label +
          '<svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor" opacity=".5"><path d="M0 0l5 6 5-6z"/></svg>';
      }

      try {
        await fetch('/api/admin-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify({ pageId: currentPageId, status })
        });
      } catch {}
    }

    let cachedComments = null;
    const translations = {};

    function renderComments() {
      const container = document.getElementById('messages');
      if (!container) return;
      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;

      if (!cachedComments || cachedComments.length === 0) {
        container.innerHTML = '<div class="no-messages">Hələ mesaj yoxdur</div>';
        return;
      }

      container.innerHTML = cachedComments.map(c => {
        const isMine = c.isAdmin;
        const t = translations[c.id];
        const body = (t && t.shown) ? t.text : c.text;
        const label = t
          ? (t.loading ? 'Tərcümə olunur...' : (t.shown ? 'Orijinal' : 'Tərcümə et'))
          : 'Tərcümə et';
        return '<div class="msg-row ' + (isMine ? 'mine' : 'theirs') + '">' +
          (isMine ? '<span class="msg-meta msg-who">Samir</span>' : '<span class="msg-meta msg-who-user">İstifadəçi</span>') +
          '<div class="bubble ' + (isMine ? 'mine' : 'theirs') + '">' + escHtml(body) + '</div>' +
          '<span class="msg-meta">' + formatTime(c.time) + ' · ' +
            '<button class="tr-btn" ' + (t && t.loading ? 'disabled ' : '') +
            'onclick="toggleTranslate(\'' + c.id + '\')">' + label + '</button>' +
          '</span>' +
        '</div>';
      }).join('');

      if (wasAtBottom || lastCommentCount === -1) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function toggleTranslate(id) {
      const c = (cachedComments || []).find(x => x.id === id);
      if (!c) return;

      const existing = translations[id];
      if (existing && !existing.loading) {
        existing.shown = !existing.shown;
        renderComments();
        return;
      }
      if (existing) return; // artıq yüklənir

      translations[id] = { text: c.text, shown: false, loading: true };
      renderComments();

      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: c.text, target: 'az' })
        });
        const data = await res.json();
        if (data.success) {
          translations[id] = { text: data.translated, shown: true };
        } else {
          delete translations[id];
          alert('Tərcümə alınmadı');
        }
      } catch {
        delete translations[id];
        alert('Tərcümə alınmadı');
      }
      renderComments();
    }

    async function loadComments() {
      try {
        const res = await fetch('/api/comments?id=' + trackingId);
        const data = await res.json();
        if (!data.success) return;

        const count = data.comments?.length || 0;
        if (count === lastCommentCount) return;

        cachedComments = data.comments || [];
        renderComments();
        lastCommentCount = count;
      } catch {}
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const btn = document.getElementById('sendBtn');
      const errEl = document.getElementById('sendError');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      errEl.classList.remove('visible');

      try {
        const res = await fetch('/api/admin-comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify({ trackingId, message: text })
        });

        const data = await res.json();

        if (data.success) {
          input.value = '';
          lastCommentCount = -1;
          await loadComments();
        } else {
          errEl.textContent = data.error || 'Göndərilmədi';
          errEl.classList.add('visible');
        }
      } catch {
        errEl.textContent = 'Bağlantı xətası';
        errEl.classList.add('visible');
      }

      btn.disabled = false;
      input.focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function loadScript(src, pk) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        if (pk) s.setAttribute('data-clerk-publishable-key', pk);
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    (async () => {
      try {
        const { publishableKey } = await fetch('/api/config').then(r => r.json());
        if (!publishableKey) { showAuth(); return; }

        const b64 = publishableKey.replace(/^pk_(test|live)_/, '');
        const frontendApi = 'https://' + atob(b64).replace(/\$$/, '');
        await loadScript(`${frontendApi}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`, publishableKey);

        const clerk = await new Promise((resolve, reject) => {
          if (window.Clerk) return resolve(window.Clerk);
          window.addEventListener('clerk:load', () => resolve(window.Clerk), { once: true });
          setTimeout(() => reject(new Error('timeout')), 8000);
        });

        if (!clerk.loaded) await clerk.load();
        window._clerk = clerk;

        if (!clerk.user) { showAuth(); return; }

        authToken = await clerk.session.getToken();

        const testRes = await fetch('/api/admin-tasks', {
          headers: { 'Authorization': 'Bearer ' + authToken }
        });

        if (testRes.status === 403) {
          document.getElementById('deniedCard').style.display = 'block';
          return;
        }

        document.getElementById('mainContent').style.display = 'block';
        await loadStatus();
        loadComments();
        setInterval(loadComments, 3000);
        setInterval(loadStatus, 30000);
      } catch (e) {
        showAuth();
      }
    })();

    function showAuth() {
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('signInBtn').onclick = () => window._clerk?.openSignIn();
    }
  </script>
</body>
</html>
