<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Sorğularım — Support Panel</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Support Panel" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <script>
    (function() {
      var saved = localStorage.getItem('sp-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #171717;
      --border: #262626;
      --border-hover: #333;
      --text: #e8e8e8;
      --muted: #666;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --blue: #60a5fa;
    }

    [data-theme="light"] {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #e0e0da;
      --border-hover: #c8c8c0;
      --text: #1a1a1a;
      --muted: #999;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #d97706;
      --blue: #2563eb;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .wrap { width: 100%; max-width: 520px; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .logo-text { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .logo-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 8px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border-hover); }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }

    .lang-sel {
      appearance: none; -webkit-appearance: none;
      background: transparent; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; padding: 3px 6px;
      font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: .04em;
      outline: none; transition: color .15s, border-color .15s;
    }
    .lang-sel:hover { color: var(--text); border-color: var(--border-hover); }

    .page-header { margin-bottom: 1.75rem; }
    .page-header h1 { font-size: 24px; font-weight: 300; margin-bottom: 0.35rem; }
    .page-header p { font-size: 13px; color: var(--muted); }

    .user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .user-bar.visible { display: flex; }
    .user-name { font-size: 13px; color: var(--muted); }
    .user-actions { display: flex; align-items: center; gap: 12px; }
    .new-req-link {
      font-size: 12px;
      color: var(--green);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .new-req-link:hover { opacity: 0.75; }
    .signout-btn {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .signout-btn:hover { color: var(--text); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .auth-card-inner {
      text-align: center;
      padding: 1.5rem 0.5rem;
    }
    .auth-icon { font-size: 32px; margin-bottom: 1rem; opacity: 0.6; }
    .auth-card-inner h2 { font-weight: 400; font-size: 20px; margin-bottom: 0.5rem; }
    .auth-card-inner p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .auth-btn {
      display: inline-block;
      padding: 10px 28px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .auth-btn:hover { opacity: 0.88; }

    .state-msg { text-align: center; padding: 2.5rem 0; color: var(--muted); font-size: 14px; }
    .empty-icon { font-size: 28px; margin-bottom: 0.75rem; opacity: 0.4; }

    .task-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: border-color 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .task-card:hover { border-color: var(--border-hover); }

    .task-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .task-name {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      flex: 1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .not-started { background: rgba(128,128,128,.06); color: var(--muted); border: 1px solid var(--border); }
    .in-progress  { background: rgba(96,165,250,.1); color: var(--blue); border: 1px solid rgba(96,165,250,.3); }
    .done         { background: rgba(74,222,128,.1); color: var(--green); border: 1px solid rgba(74,222,128,.3); }
    .on-hold      { background: rgba(128,128,128,.04); color: var(--muted); border: 1px solid var(--border); }
    .cancelled    { background: rgba(248,113,113,.08); color: var(--red); border: 1px solid rgba(248,113,113,.2); }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-chip {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .priority-dot {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .priority-dot span { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

    .tag-chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s;
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Support Panel</span>
      <div class="logo-right">
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Theme">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">☽</span>
        </button>
        <select class="lang-sel" id="langSel" onchange="setLang(this.value)">
          <option value="az">AZ</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
      </div>
    </div>

    <div class="user-bar" id="userBar">
      <span class="user-name" id="userNameEl"></span>
      <div class="user-actions">
        <a href="/" class="new-req-link" id="newReqLink">+ Yeni sorğu</a>
        <button class="signout-btn" id="signoutBtnEl" onclick="window._clerk && window._clerk.signOut()">Çıxış</button>
      </div>
    </div>

    <div class="page-header">
      <h1 id="pageH1">Sorğularım</h1>
      <p id="pageSubtitle">Göndərdiyiniz bütün sorğular</p>
    </div>

    <div id="loadingState" class="state-msg">Yüklənir...</div>

    <div id="authCard" style="display:none"></div>

    <div id="taskList" style="display:none">
      <div class="task-list" id="tasksContainer"></div>
    </div>

    <a href="/" class="back-link" id="backLinkEl">← Yeni sorğu göndər</a>
  </div>

  <script>
    let lang = localStorage.getItem('sp-lang') || 'az';
    let cachedTasks = null;

    const T = {
      az: {
        pageH1: 'Sorğularım', pageSubtitle: 'Göndərdiyiniz bütün sorğular',
        newReq: '+ Yeni sorğu', signOut: 'Çıxış', backLink: '← Yeni sorğu göndər',
        loading: 'Yüklənir...', errorConn: 'Bağlantı xətası',
        emptyGuest: 'Bu cihazdan hələ heç bir sorğu göndərməmisiniz.',
        emptyUser: 'Hələ heç bir sorğu göndərməmisiniz.',
        signInPrompt: 'Bütün cihazlardan sorğularınızı görmək üçün hesabınıza daxil olun',
        signIn: 'Daxil ol',
        statuses: {
          'Not started': { label: 'Başlanmayıb', cls: 'not-started', icon: '○' },
          'In progress': { label: 'İcrada',      cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'Yoxlanılır',  cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Tamamlandı',  cls: 'done',        icon: '●' },
          'On Hold':     { label: 'Gözləmədə',   cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Ləğv edildi', cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: 'Yüksək', Medium: 'Orta', Low: 'Aşağı' },
      },
      en: {
        pageH1: 'My Requests', pageSubtitle: 'All your submitted requests',
        newReq: '+ New request', signOut: 'Sign out', backLink: '← Submit new request',
        loading: 'Loading...', errorConn: 'Connection error',
        emptyGuest: 'No requests submitted from this device yet.',
        emptyUser: 'You haven\'t submitted any requests yet.',
        signInPrompt: 'Sign in to see requests from all your devices',
        signIn: 'Sign in',
        statuses: {
          'Not started': { label: 'Not started', cls: 'not-started', icon: '○' },
          'In progress': { label: 'In progress', cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'In review',   cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Done',         cls: 'done',        icon: '●' },
          'On Hold':     { label: 'On hold',      cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Cancelled',    cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: 'High', Medium: 'Medium', Low: 'Low' },
      },
      ru: {
        pageH1: 'Мои запросы', pageSubtitle: 'Все ваши отправленные запросы',
        newReq: '+ Новый запрос', signOut: 'Выйти', backLink: '← Новый запрос',
        loading: 'Загрузка...', errorConn: 'Ошибка соединения',
        emptyGuest: 'С этого устройства ещё не было запросов.',
        emptyUser: 'Вы ещё не отправили ни одного запроса.',
        signInPrompt: 'Войдите, чтобы видеть запросы со всех устройств',
        signIn: 'Войти',
        statuses: {
          'Not started': { label: 'Не начато',      cls: 'not-started', icon: '○' },
          'In progress': { label: 'В процессе',     cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'На проверке',    cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Завершено',       cls: 'done',        icon: '●' },
          'On Hold':     { label: 'Приостановлено', cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Отменено',       cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: 'Высокий', Medium: 'Средний', Low: 'Низкий' },
      },
    };

    function tr(key) { return (T[lang] || T.az)[key] ?? T.az[key]; }

    function setLang(l) {
      lang = l;
      localStorage.setItem('sp-lang', l);
      applyLang();
      if (cachedTasks !== null) renderTasks(cachedTasks);
    }

    function applyLang() {
      document.getElementById('langSel').value = lang;
      document.getElementById('pageH1').textContent = tr('pageH1');
      document.getElementById('pageSubtitle').textContent = tr('pageSubtitle');
      document.getElementById('newReqLink').textContent = tr('newReq');
      document.getElementById('signoutBtnEl').textContent = tr('signOut');
      document.getElementById('backLinkEl').textContent = tr('backLink');
      const ls = document.getElementById('loadingState');
      if (ls && ls.style.display !== 'none') ls.textContent = tr('loading');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sp-theme', next);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('sp-theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      }
    });

    const priorityColors = { High: 'var(--red)', Medium: 'var(--yellow)', Low: 'var(--green)' };

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('az-AZ', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function escHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTasks(tasks) {
      cachedTasks = tasks;
      const container = document.getElementById('tasksContainer');
      const statuses = tr('statuses');
      const priorities = tr('priorities');

      if (!tasks.length) {
        const isGuest = !window._clerk?.user;
        const msg = isGuest
          ? `<div class="empty-icon">📭</div>${tr('emptyGuest')}<br><br><small style="color:var(--muted)">${tr('signInPrompt')}: <button class="signout-btn" style="font-size:12px;text-decoration:underline" onclick="window._clerk && window._clerk.openSignIn()">${tr('signIn')}</button>.</small>`
          : `<div class="empty-icon">📭</div>${tr('emptyUser')}`;
        container.innerHTML = `<div class="state-msg">${msg}</div>`;
        document.getElementById('taskList').style.display = 'block';
        return;
      }

      container.innerHTML = tasks.map(t => {
        const st = statuses[t.status] || { label: t.status, cls: 'not-started', icon: '○' };
        const trackHref = t.trackingId ? `/track.html?id=${t.trackingId}` : '#';

        const priorityHtml = t.priority
          ? `<span class="priority-dot"><span style="background:${priorityColors[t.priority]||'var(--muted)'}"></span>${escHtml(priorities[t.priority] || t.priority)}</span>`
          : '';

        const tagsHtml = (t.tags || []).map(tag => `<span class="tag-chip">${escHtml(tag)}</span>`).join('');

        const dateHtml = t.dueDate
          ? `<span class="meta-chip">${formatDate(t.dueDate)}</span>`
          : `<span class="meta-chip">${formatDate(t.createdTime)}</span>`;

        return `
          <a class="task-card" href="${escHtml(trackHref)}">
            <div class="task-card-top">
              <span class="task-name">${escHtml(t.taskName)}</span>
              <span class="status-badge ${st.cls}">${st.icon} ${st.label}</span>
            </div>
            <div class="task-meta">
              ${priorityHtml}
              ${dateHtml}
              ${tagsHtml}
            </div>
          </a>`;
      }).join('');

      document.getElementById('taskList').style.display = 'block';
    }

    function getLocalIds() {
      return JSON.parse(localStorage.getItem('sp-tickets') || '[]');
    }

    async function fetchByIds(ids) {
      if (!ids.length) return [];
      const res = await fetch('/api/local-tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackingIds: ids })
      });
      const data = await res.json();
      return data.success ? data.tasks : [];
    }

    async function fetchByUser(authToken) {
      const res = await fetch('/api/my-tasks', {
        headers: { 'Authorization': 'Bearer ' + authToken }
      });
      const data = await res.json();
      return data.success ? data.tasks : [];
    }

    function mergeTasks(serverTasks, localTasks) {
      const seen = new Set(serverTasks.map(t => t.trackingId));
      const extras = localTasks.filter(t => !seen.has(t.trackingId));
      return [...serverTasks, ...extras];
    }

    function showError(msg) {
      document.getElementById('loadingState').textContent = msg;
      document.getElementById('loadingState').style.display = 'block';
    }

    async function showTasksForGuest() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('authCard').style.display = 'none';
      const ids = getLocalIds();
      if (!ids.length) {
        renderTasks([]);
        return;
      }
      try {
        const tasks = await fetchByIds(ids);
        renderTasks(tasks);
      } catch {
        showError(tr('errorConn'));
      }
    }

    async function showTasksForUser(user, clerk) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('authCard').style.display = 'none';

      const nameEl = document.getElementById('userNameEl');
      nameEl.textContent = user.fullName || user.primaryEmailAddress?.emailAddress || '';
      document.getElementById('userBar').classList.add('visible');

      try {
        const token = await clerk.session.getToken();
        const [serverTasks, localTasks] = await Promise.all([
          fetchByUser(token),
          fetchByIds(getLocalIds())
        ]);
        renderTasks(mergeTasks(serverTasks, localTasks));
      } catch {
        showError(tr('errorConn'));
      }
    }

    function loadScript(src, pk) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        if (pk) s.setAttribute('data-clerk-publishable-key', pk);
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    applyLang();

    (async () => {
      const localIds = getLocalIds();

      try {
        const { publishableKey } = await fetch('/api/config').then(r => r.json());
        if (!publishableKey) { await showTasksForGuest(); return; }

        const b64 = publishableKey.replace(/^pk_(test|live)_/, '');
        const frontendApi = 'https://' + atob(b64).replace(/\$$/, '');

        await loadScript(`${frontendApi}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`, publishableKey);

        const clerk = await new Promise((resolve, reject) => {
          if (window.Clerk) return resolve(window.Clerk);
          window.addEventListener('clerk:load', () => resolve(window.Clerk), { once: true });
          setTimeout(() => reject(new Error('Clerk load timeout')), 8000);
        });

        if (!clerk.loaded) await clerk.load();
        window._clerk = clerk;

        if (clerk.user) await showTasksForUser(clerk.user, clerk);
        else await showTasksForGuest();

        clerk.addListener(({ user }) => {
          if (user) showTasksForUser(user, clerk);
          else showTasksForGuest();
        });
      } catch {
        await showTasksForGuest();
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
