<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Panel</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Support Panel" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <script>
    (function() {
      var saved = localStorage.getItem('sp-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #171717;
      --border: #262626;
      --border-hover: #333;
      --text: #e8e8e8;
      --muted: #666;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    [data-theme="light"] {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #e0e0da;
      --border-hover: #c8c8c0;
      --text: #1a1a1a;
      --muted: #999;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #d97706;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap { width: 100%; max-width: 520px; }
    .top { margin-bottom: 2.5rem; }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .logo-text {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .logo-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 8px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border-hover); }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }

    /* User bar */
    .user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }
    .user-bar.visible { display: flex; }
    .user-name { font-size: 13px; color: var(--muted); }
    .user-actions { display: flex; align-items: center; gap: 12px; }
    .my-req-link {
      font-size: 12px;
      color: var(--green);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .my-req-link:hover { opacity: 0.75; }
    .signout-btn {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .signout-btn:hover { color: var(--text); }

    h1 { font-size: 28px; font-weight: 300; line-height: 1.2; margin-bottom: 0.5rem; }
    .subtitle { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
    }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .required-star { color: var(--red); margin-left: 2px; }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus { border-color: var(--border-hover); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

    .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

    /* Priority */
    .priority-group { display: flex; gap: 8px; }

    .priority-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .priority-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .priority-btn.active[data-p="High"] { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.06); }
    .priority-btn.active[data-p="Medium"] { border-color: var(--yellow); color: var(--yellow); background: rgba(251,191,36,0.06); }
    .priority-btn.active[data-p="Low"] { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.06); }

    .p-bars { display: inline-flex; align-items: flex-end; gap: 2px; }
    .p-bars b { display: block; width: 3px; border-radius: 1px; background: currentColor; opacity: 0.2; }
    .p-bars b.on { opacity: 1; }

    /* Tags */
    .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    .tag-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tag-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .tag-btn.selected { border-color: var(--text); color: var(--text); background: rgba(255,255,255,0.06); }

    /* Datetime */
    .datetime-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dt-group { display: flex; flex-direction: column; gap: 6px; }

    .dt-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dt-header { display: flex; align-items: center; justify-content: space-between; }

    .clear-time-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .clear-time-btn:hover { color: var(--text); }

    .time-row { display: flex; align-items: center; gap: 6px; }
    .time-row .custom-select { flex: 1; }

    .time-sep {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      color: var(--muted);
      user-select: none;
    }

    /* Flatpickr date input */
    .flatpickr-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      cursor: pointer;
    }
    .flatpickr-input:focus { border-color: var(--border-hover); }
    .flatpickr-input::placeholder { color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.04em; }
    .date-error .flatpickr-input { border-color: rgba(248,113,113,0.5); }

    /* Flatpickr calendar */
    .flatpickr-calendar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      font-family: 'DM Sans', sans-serif;
      padding: 8px;
      width: 272px;
    }
    .flatpickr-calendar.arrowTop:before,
    .flatpickr-calendar.arrowTop:after,
    .flatpickr-calendar.arrowBottom:before,
    .flatpickr-calendar.arrowBottom:after { display: none; }
    .flatpickr-months { padding: 2px 0 6px; }
    .flatpickr-months .flatpickr-month { background: transparent; color: var(--text); fill: var(--text); height: 32px; }
    .flatpickr-current-month { font-size: 13px; padding-top: 5px; }
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      border: none;
      outline: none;
    }
    .flatpickr-current-month input.cur-year {
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--muted); }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--text); }
    .flatpickr-weekdays { background: transparent; margin-bottom: 2px; }
    span.flatpickr-weekday { background: transparent; color: var(--muted); font-size: 11px; font-family: 'DM Sans', sans-serif; }
    .flatpickr-days { border: none; }
    .dayContainer { padding: 0; min-width: unset; max-width: unset; width: 100%; }
    .flatpickr-day {
      color: var(--text);
      border-radius: 6px;
      height: 34px;
      line-height: 34px;
      font-size: 13px;
      border: 1px solid transparent;
      max-width: unset;
      flex-basis: calc(100% / 7);
    }
    .flatpickr-day:hover { background: var(--bg); border-color: transparent; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover {
      background: var(--text);
      color: var(--bg);
      border-color: transparent;
    }
    .flatpickr-day.today { border-color: var(--border-hover); }
    .flatpickr-day.today.selected { border-color: transparent; }
    .flatpickr-day.prevMonthDay,
    .flatpickr-day.nextMonthDay { color: var(--border); }
    .flatpickr-day.flatpickr-disabled { color: var(--border); opacity: 0.4; }
    .numInputWrapper span { border-color: var(--border); }
    .numInputWrapper span:after { border-top-color: var(--muted); border-bottom-color: var(--muted); }
    .numInputWrapper:hover { background: var(--bg); }

    /* Custom month dropdown inside Flatpickr */
    .fp-month-wrap { position: relative; display: inline-block; }

    .fp-month-btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .fp-month-btn:hover { background: var(--bg); }

    .fp-month-list {
      display: none;
      position: fixed;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 100000;
      width: 110px;
      max-height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .fp-month-list.open { display: block; }

    .fp-month-item {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: left;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      transition: background 0.1s;
    }
    .fp-month-item:hover { background: var(--bg); }
    .fp-month-item.active { color: var(--green); }

    /* Custom select dropdown */
    .custom-select { position: relative; user-select: none; }

    .cs-btn {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s;
    }
    .cs-btn:hover { border-color: var(--border-hover); }
    .cs-btn.has-value { color: var(--text); }

    .cs-arrow {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.15s;
      line-height: 1;
    }
    .custom-select.open .cs-arrow { transform: rotate(180deg); }

    .cs-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 99;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .custom-select.open .cs-list { display: block; }

    .cs-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      color: var(--text);
      transition: background 0.1s;
    }
    .cs-item:hover { background: var(--bg); }
    .cs-item.active { color: var(--green); }

    /* Errors */
    .datetime-row.date-error .flatpickr-input { border-color: rgba(248,113,113,0.5); }
    .tags-grid.has-error .tag-btn:not(.selected) { border-color: rgba(248,113,113,0.4); }

    .field-error { font-size: 12px; color: var(--red); margin-top: 7px; display: none; }
    .field-error.visible { display: block; }

    /* Submit */
    .submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 12px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .submit:hover { opacity: 0.88; }
    .submit:active { transform: scale(0.99); }
    .submit:disabled { opacity: 0.35; cursor: not-allowed; }

    .msg {
      margin-top: 1rem;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
    }
    .msg.success { display: block; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.25); color: var(--green); }
    .msg.error { display: block; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--red); }
    .msg.loading { display: block; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--muted); }

    .track-link { color: var(--green); text-decoration: none; display: inline-block; margin-top: 5px; font-size: 12px; opacity: 0.85; }
    .track-link:hover { opacity: 1; }

    .guest-note {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }
    [data-theme="light"] .guest-note { background: rgba(0,0,0,0.02); }
    .guest-note-icon { font-size: 14px; opacity: 0.5; flex-shrink: 0; }
    .guest-note-text { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
    .guest-note-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      padding: 5px 12px;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .guest-note-btn:hover { border-color: var(--border-hover); }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo">
        <div class="logo-dot"></div>
        <span class="logo-text">Support Panel</span>
        <div class="logo-right">
          <button class="theme-btn" onclick="toggleTheme()" aria-label="Tema dəyiş">
            <span class="icon-sun">☀</span>
            <span class="icon-moon">☽</span>
          </button>
        </div>
      </div>

      <div class="user-bar" id="userBar">
        <span class="user-name" id="userNameEl"></span>
        <div class="user-actions">
          <a href="/my-requests" class="my-req-link" id="myReqLink">Sorğularım →</a>
          <button class="signout-btn" id="signoutBtn" onclick="window._clerk && window._clerk.signOut()">Çıxış</button>
        </div>
      </div>

      <h1>Yeni istək göndər</h1>
      <p class="subtitle">Probleminizi və ya təklifinizi göndərin, mümkün ən qısa zamanda baxılacaq.</p>
    </div>

    <div class="guest-note" id="guestNote">
      <span class="guest-note-icon">💡</span>
      <span class="guest-note-text">Göndərdiyiniz sorğuların statusunu izləmək və tarixçənizi görmək üçün hesabınıza daxil olun.</span>
      <button class="guest-note-btn" onclick="window._clerk ? window._clerk.openSignIn() : null">Daxil ol</button>
    </div>

    <div class="card" id="mainCard">
      <div class="field">
        <label>Başlıq <span class="required-star">*</span></label>
        <input type="text" id="taskName" placeholder="Problemi qısaca ifadə edin..." />
      </div>

      <div class="field">
        <label>Ətraflı açıqlama</label>
        <textarea id="description" placeholder="Nə baş verdi? Hansı addımları atdınız? Nə gözləyirdiniz?"></textarea>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Prioritet</label>
        <div class="priority-group">
          <button class="priority-btn" data-p="High" onclick="setPriority('High')"><span class="p-bars"><b class="on" style="height:5px"></b><b class="on" style="height:9px"></b><b class="on" style="height:13px"></b></span>Yüksək</button>
          <button class="priority-btn" data-p="Medium" onclick="setPriority('Medium')"><span class="p-bars"><b class="on" style="height:5px"></b><b class="on" style="height:9px"></b><b style="height:13px"></b></span>Orta</button>
          <button class="priority-btn" data-p="Low" onclick="setPriority('Low')"><span class="p-bars"><b class="on" style="height:5px"></b><b style="height:9px"></b><b style="height:13px"></b></span>Aşağı</button>
        </div>
      </div>

      <div class="field">
        <label>Son tarix <span class="required-star">*</span></label>
        <div class="datetime-row" id="dueDateWrap">
          <div class="dt-group">
            <span class="dt-label">Gün</span>
            <input type="text" id="dueDate" placeholder="--/--/----" readonly />
          </div>
          <div class="dt-group">
            <div class="dt-header">
              <span class="dt-label">Saat</span>
              <button class="clear-time-btn" onclick="clearTime()">Təmizlə</button>
            </div>
            <div class="time-row">
              <div class="custom-select" id="hourSelect">
                <div class="cs-btn" onclick="toggleDropdown('hourSelect')">
                  <span class="cs-val">--</span>
                  <span class="cs-arrow">▾</span>
                </div>
                <div class="cs-list"></div>
              </div>
              <span class="time-sep">:</span>
              <div class="custom-select" id="minuteSelect">
                <div class="cs-btn" onclick="toggleDropdown('minuteSelect')">
                  <span class="cs-val">--</span>
                  <span class="cs-arrow">▾</span>
                </div>
                <div class="cs-list"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="field-error" id="dateError">Zəhmət olmasa tarixi seçin</div>
      </div>

      <div class="field">
        <label>Tag-lar <span class="required-star">*</span></label>
        <div class="tags-grid" id="tagsGrid">
          <button type="button" class="tag-btn" data-tag="Jira" onclick="selectTag(this)">Jira</button>
          <button type="button" class="tag-btn" data-tag="Confluence" onclick="selectTag(this)">Confluence</button>
          <button type="button" class="tag-btn" data-tag="FortiClient" onclick="selectTag(this)">FortiClient</button>
          <button type="button" class="tag-btn" data-tag="GlobalProtect" onclick="selectTag(this)">GlobalProtect</button>
          <button type="button" class="tag-btn" data-tag="WireGuard" onclick="selectTag(this)">WireGuard</button>
          <button type="button" class="tag-btn" data-tag="Outlook" onclick="selectTag(this)">Outlook</button>
          <button type="button" class="tag-btn" data-tag="Discord" onclick="selectTag(this)">Discord</button>
          <button type="button" class="tag-btn" data-tag="Digər" onclick="selectTag(this)">Digər</button>
        </div>
        <div class="field-error" id="tagError">Zəhmət olmasa bir tag seçin</div>
      </div>

      <button class="submit" id="submitBtn" onclick="createTask()">Göndər →</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    let selectedPriority = '';
    let selectedTag = '';
    let selectedHour = '';
    let selectedMinute = '';
    let fp = null;

    // Build hour options: 00–23
    const hourList = document.querySelector('#hourSelect .cs-list');
    for (let h = 0; h < 24; h++) {
      const v = String(h).padStart(2, '0');
      const item = document.createElement('div');
      item.className = 'cs-item';
      item.dataset.val = v;
      item.textContent = v;
      item.onclick = () => pickOption('hourSelect', v, 'hour');
      hourList.appendChild(item);
    }

    // Build minute options: 00, 05, …, 55
    const minuteList = document.querySelector('#minuteSelect .cs-list');
    [0,5,10,15,20,25,30,35,40,45,50,55].forEach(m => {
      const v = String(m).padStart(2, '0');
      const item = document.createElement('div');
      item.className = 'cs-item';
      item.dataset.val = v;
      item.textContent = v;
      item.onclick = () => pickOption('minuteSelect', v, 'minute');
      minuteList.appendChild(item);
    });

    function clearTime() {
      selectedHour = '';
      selectedMinute = '';
      ['hourSelect', 'minuteSelect'].forEach(id => {
        const el = document.getElementById(id);
        el.querySelector('.cs-val').textContent = '--';
        el.querySelector('.cs-btn').classList.remove('has-value');
        el.querySelectorAll('.cs-item').forEach(i => i.classList.remove('active'));
      });
    }

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isOpen = el.classList.contains('open');
      closeAllDropdowns();
      if (!isOpen) el.classList.add('open');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-select.open').forEach(el => el.classList.remove('open'));
    }

    function pickOption(selectId, val, type) {
      const el = document.getElementById(selectId);
      el.querySelector('.cs-val').textContent = val;
      el.querySelector('.cs-btn').classList.add('has-value');
      el.querySelectorAll('.cs-item').forEach(i => i.classList.toggle('active', i.dataset.val === val));
      closeAllDropdowns();
      if (type === 'hour') selectedHour = val;
      else selectedMinute = val;
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.custom-select')) closeAllDropdowns();
    });

    const AZ_MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
    let _monthBtn = null;
    let _monthList = null;

    function buildMonthSelect(sel, dateStr, instance) {
      const native = instance.monthNav.querySelector('.flatpickr-monthDropdown-months');
      if (!native) return;

      _monthBtn = document.createElement('button');
      _monthBtn.type = 'button';
      _monthBtn.className = 'fp-month-btn';
      _monthBtn.textContent = AZ_MONTHS[instance.currentMonth];

      _monthList = document.createElement('div');
      _monthList.className = 'fp-month-list';

      AZ_MONTHS.forEach((name, idx) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'fp-month-item' + (idx === instance.currentMonth ? ' active' : '');
        item.textContent = name;
        item.addEventListener('click', e => {
          e.stopPropagation();
          instance.changeMonth(idx - instance.currentMonth);
          _monthList.classList.remove('open');
        });
        _monthList.appendChild(item);
      });

      _monthBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = _monthList.classList.contains('open');
        _monthList.classList.remove('open');
        if (!isOpen) {
          const rect = _monthBtn.getBoundingClientRect();
          _monthList.style.top = (rect.bottom + 4) + 'px';
          _monthList.style.left = (rect.left + rect.width / 2) + 'px';
          _monthList.classList.add('open');
        }
      });

      native.replaceWith(_monthBtn);
      document.body.appendChild(_monthList);

      document.addEventListener('click', e => {
        if (e.target !== _monthBtn && !_monthList.contains(e.target)) {
          _monthList.classList.remove('open');
        }
      });
    }

    function updateMonthSelect(sel, dateStr, instance) {
      if (_monthBtn) _monthBtn.textContent = AZ_MONTHS[instance.currentMonth];
      if (_monthList) _monthList.querySelectorAll('.fp-month-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === instance.currentMonth);
      });
    }

    // Flatpickr
    fp = flatpickr('#dueDate', {
      dateFormat: 'd/m/Y',
      disableMobile: true,
      onReady: buildMonthSelect,
      onMonthChange: updateMonthSelect,
      onChange: () => {
        document.getElementById('dueDateWrap').classList.remove('date-error');
        document.getElementById('dateError').classList.remove('visible');
      }
    });

    // Theme
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sp-theme', next);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('sp-theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      }
    });

    function setPriority(p) {
      selectedPriority = p;
      document.querySelectorAll('.priority-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.p === p);
      });
    }

    function selectTag(btn) {
      const tag = btn.dataset.tag;
      if (selectedTag === tag) {
        selectedTag = '';
        btn.classList.remove('selected');
      } else {
        selectedTag = tag;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      }
      document.getElementById('tagsGrid').classList.remove('has-error');
      document.getElementById('tagError').classList.remove('visible');
    }

    async function createTask() {
      const taskName = document.getElementById('taskName').value.trim();

      if (!taskName) { showMsg('Başlıq daxil edin', 'error'); return; }

      if (!selectedTag) {
        document.getElementById('tagsGrid').classList.add('has-error');
        document.getElementById('tagError').classList.add('visible');
        document.getElementById('tagsGrid').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (!fp.selectedDates.length) {
        document.getElementById('dueDateWrap').classList.add('date-error');
        document.getElementById('dateError').classList.add('visible');
        document.getElementById('dueDateWrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const description = document.getElementById('description').value.trim();
      const dateStr = fp.formatDate(fp.selectedDates[0], 'Y-m-d');
      const hasTime = selectedHour !== '';
      const isDatetime = hasTime;
      const dueMin = selectedMinute || '00';
      const dueDatetime = hasTime ? `${dateStr}T${selectedHour}:${dueMin}` : dateStr;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      showMsg('Göndərilir...', 'loading');

      let authToken = '';
      try {
        if (window._clerk && window._clerk.session) {
          authToken = await window._clerk.session.getToken();
        }
      } catch {}

      try {
        const res = await fetch('/api/create-task', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(authToken ? { 'Authorization': 'Bearer ' + authToken } : {})
          },
          body: JSON.stringify({ taskName, description, priority: selectedPriority, dueDate: dueDatetime, isDatetime, tags: [selectedTag] })
        });

        const data = await res.json();

        if (data.success) {
          const stored = JSON.parse(localStorage.getItem('sp-tickets') || '[]');
          if (!stored.includes(data.trackingId)) stored.unshift(data.trackingId);
          localStorage.setItem('sp-tickets', JSON.stringify(stored.slice(0, 100)));

          const trackUrl = '/track.html?id=' + data.trackingId;
          showMsg('İstəyiniz qeydə alındı! <a class="track-link" href="' + trackUrl + '" target="_blank">Sorğunun statusunu izlə →</a>', 'success');
          document.getElementById('taskName').value = '';
          document.getElementById('description').value = '';
          fp.clear();
          selectedPriority = '';
          selectedTag = '';
          selectedHour = '';
          selectedMinute = '';
          document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
          ['hourSelect', 'minuteSelect'].forEach(id => {
            const el = document.getElementById(id);
            el.querySelector('.cs-val').textContent = '--';
            el.querySelector('.cs-btn').classList.remove('has-value');
            el.querySelectorAll('.cs-item').forEach(i => i.classList.remove('active'));
          });
        } else {
          showMsg('Xəta: ' + (data.error || 'Bilinməyən xəta'), 'error');
        }
      } catch (err) {
        showMsg('Bağlantı xətası: ' + err.message, 'error');
      }

      btn.disabled = false;
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.innerHTML = text;
      el.className = 'msg ' + type;
    }

    // ── Clerk auth ──────────────────────────────────────────────
    function updateUserBar(user) {
      const nameEl = document.getElementById('userNameEl');
      const userBar = document.getElementById('userBar');
      const guestNote = document.getElementById('guestNote');
      if (user) {
        nameEl.textContent = user.fullName || user.primaryEmailAddress?.emailAddress || '';
        userBar.classList.add('visible');
        guestNote.style.display = 'none';
      } else {
        userBar.classList.remove('visible');
        guestNote.style.display = '';
      }
    }

    function loadScript(src, pk) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        if (pk) s.setAttribute('data-clerk-publishable-key', pk);
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    (async () => {
      try {
        const { publishableKey } = await fetch('/api/config').then(r => r.json());
        if (!publishableKey) { showAuthCard(); return; }

        const b64 = publishableKey.replace(/^pk_(test|live)_/, '');
        const frontendApi = 'https://' + atob(b64).replace(/\$$/, '');

        await loadScript(`${frontendApi}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`, publishableKey);

        const clerk = await new Promise((resolve, reject) => {
          if (window.Clerk) return resolve(window.Clerk);
          window.addEventListener('clerk:load', () => resolve(window.Clerk), { once: true });
          setTimeout(() => reject(new Error('Clerk load timeout')), 8000);
        });

        if (!clerk.loaded) await clerk.load();
        window._clerk = clerk;

        clerk.addListener(({ user }) => updateUserBar(user));
        updateUserBar(clerk.user);
      } catch {
        // Clerk failed to load — form still works without auth
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
