<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Sorğunun statusu</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Support Panel" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <script>
    (function() {
      var saved = localStorage.getItem('sp-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #171717;
      --border: #262626;
      --border-hover: #333;
      --text: #e8e8e8;
      --muted: #666;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --blue: #60a5fa;
    }

    [data-theme="light"] {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #e0e0da;
      --border-hover: #c8c8c0;
      --text: #1a1a1a;
      --muted: #999;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #d97706;
      --blue: #2563eb;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap { width: 100%; max-width: 480px; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .logo-text { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .logo-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 8px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border-hover); }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }

    .lang-sel {
      appearance: none; -webkit-appearance: none;
      background: transparent; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; padding: 3px 6px;
      font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: .04em;
      outline: none; transition: color .15s, border-color .15s;
      min-width: 28px; max-width: 130px;
    }
    .lang-sel:hover { color: var(--text); border-color: var(--border-hover); }
    .goog-te-banner-frame, .skiptranslate { display: none !important; }
    body { top: 0 !important; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 2rem 0; }
    .error-state { text-align: center; color: var(--red); font-size: 14px; padding: 2rem 0; }
    .task-title { font-size: 20px; font-weight: 400; margin-bottom: 1rem; line-height: 1.3; }

    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 1.25rem; }
    .not-started { background: rgba(128,128,128,.06); color: var(--muted); border: 1px solid var(--border); }
    .in-progress { background: rgba(96,165,250,.1); color: var(--blue); border: 1px solid rgba(96,165,250,.3); }
    .done { background: rgba(74,222,128,.1); color: var(--green); border: 1px solid rgba(74,222,128,.3); }
    .on-hold { background: rgba(128,128,128,.04); color: var(--muted); border: 1px solid var(--border); }
    .cancelled { background: rgba(248,113,113,.08); color: var(--red); border: 1px solid rgba(248,113,113,.2); }

    .divider { height: 1px; background: var(--border); margin: 1rem 0; }
    .meta { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
    .meta-label { color: var(--muted); }

    .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }

    .messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; min-height: 60px; max-height: 360px; overflow-y: auto; scroll-behavior: smooth; }
    .msg-row { display: flex; flex-direction: column; gap: 3px; }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.theirs { align-items: flex-start; }

    .bubble { padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 85%; }
    .bubble.mine { background: rgba(128,128,128,.1); color: var(--text); border-bottom-right-radius: 3px; }
    .bubble.theirs { background: rgba(74,222,128,.1); color: var(--green); border: 1px solid rgba(74,222,128,.2); border-bottom-left-radius: 3px; }

    .msg-meta { font-size: 11px; color: var(--muted); padding: 0 4px; }
    .msg-who { color: var(--green); }
    .no-messages { font-size: 13px; color: var(--muted); text-align: center; padding: 1rem 0; }

    .input-row { display: flex; gap: 8px; }
    .msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border-color .15s, background 0.2s, color 0.2s;
    }
    .msg-input:focus { border-color: var(--border-hover); }
    .msg-input::placeholder { color: var(--muted); }

    .send-btn {
      padding: 9px 16px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .send-btn:hover { opacity: .88; }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }

    .tracking-id { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .back-link { display: inline-block; margin-top: 1.5rem; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .15s; }
    .back-link:hover { color: var(--text); }

    .send-error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; }
    .send-error.visible { display: block; }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Support Panel</span>
      <div class="logo-right">
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Theme">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">☽</span>
        </button>
        <select class="lang-sel" id="langSel" onchange="setLang(this.value)"></select>
      </div>
    </div>

    <div class="card" id="statusCard">
      <div class="loading" id="initialLoading">Yüklənir...</div>
    </div>

    <div class="card" id="chatCard" style="display:none">
      <div class="section-label" id="sectionMessages">Mesajlar</div>
      <div class="messages" id="messages">
        <div class="no-messages" id="noMsgEl">Hələ mesaj yoxdur</div>
      </div>
      <div class="input-row">
        <input class="msg-input" id="msgInput" placeholder="Mesaj yazın..." onkeydown="handleKey(event)" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Göndər</button>
      </div>
      <div class="send-error" id="sendError"></div>
    </div>

    <div class="tracking-id" id="trackingIdLabel" style="display:none"></div>
    <a href="/" class="back-link" id="backLinkEl">← Yeni sorğu göndər</a>
  </div>

  <div id="gTranslate" style="display:none"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const trackingId = params.get('id');
    let lastCommentCount = -1;
    let cachedStatus = null;
    let cachedComments = null;

    const LANGUAGES = [
      { code: 'az', name: 'Azərbaycan' },
      { code: 'en', name: 'English' },
      { code: 'ru', name: 'Русский' },
      { code: 'tr', name: 'Türkçe' },
      { code: 'de', name: 'Deutsch' },
      { code: 'fr', name: 'Français' },
      { code: 'es', name: 'Español' },
      { code: 'it', name: 'Italiano' },
      { code: 'pt', name: 'Português' },
      { code: 'nl', name: 'Nederlands' },
      { code: 'pl', name: 'Polski' },
      { code: 'sv', name: 'Svenska' },
      { code: 'da', name: 'Dansk' },
      { code: 'no', name: 'Norsk' },
      { code: 'fi', name: 'Suomi' },
      { code: 'cs', name: 'Čeština' },
      { code: 'sk', name: 'Slovenčina' },
      { code: 'ro', name: 'Română' },
      { code: 'hu', name: 'Magyar' },
      { code: 'el', name: 'Ελληνικά' },
      { code: 'bg', name: 'Български' },
      { code: 'uk', name: 'Українська' },
      { code: 'hr', name: 'Hrvatski' },
      { code: 'sr', name: 'Srpski' },
      { code: 'bs', name: 'Bosanski' },
      { code: 'sl', name: 'Slovenščina' },
      { code: 'mk', name: 'Македонски' },
      { code: 'sq', name: 'Shqip' },
      { code: 'lt', name: 'Lietuvių' },
      { code: 'lv', name: 'Latviešu' },
      { code: 'et', name: 'Eesti' },
      { code: 'ar', name: 'العربية' },
      { code: 'he', name: 'עברית' },
      { code: 'fa', name: 'فارسی' },
      { code: 'hi', name: 'हिन्दी' },
      { code: 'bn', name: 'বাংলা' },
      { code: 'ur', name: 'اردو' },
      { code: 'zh', name: '中文' },
      { code: 'ja', name: '日本語' },
      { code: 'ko', name: '한국어' },
      { code: 'th', name: 'ภาษาไทย' },
      { code: 'vi', name: 'Tiếng Việt' },
      { code: 'id', name: 'Indonesia' },
      { code: 'ms', name: 'Melayu' },
      { code: 'ka', name: 'ქართული' },
      { code: 'hy', name: 'Հայերեն' },
      { code: 'kk', name: 'Қазақша' },
      { code: 'uz', name: "O'zbekcha" },
    ];

    const NATIVE_LANGS = new Set(['az', 'en', 'ru']);
    const GT_CODE_MAP = { he: 'iw', zh: 'zh-CN' };
    function gtCode(c) { return GT_CODE_MAP[c] || c; }

    function detectLang() {
      const saved = localStorage.getItem('sp-lang');
      if (saved) return saved;
      const bl = (navigator.languages?.[0] || navigator.language || 'az').toLowerCase();
      const match = LANGUAGES.find(({ code }) =>
        bl === code ||
        bl.startsWith(code + '-') ||
        (code === 'no' && (bl.startsWith('nb') || bl.startsWith('nn'))) ||
        (code === 'he' && bl.startsWith('iw')) ||
        (code === 'zh' && bl.startsWith('zh'))
      );
      return match ? match.code : 'az';
    }

    let uiLang = detectLang();
    let lang = NATIVE_LANGS.has(uiLang) ? uiLang : 'en';

    const T = {
      az: {
        loading: 'Yüklənir...', errorNoId: 'Tracking ID tapılmadı', errorNotFound: 'Sorğu tapılmadı', errorConn: 'Bağlantı xətası',
        priority: 'Prioritet', dueDate: 'Son tarix', submitted: 'Göndərildi',
        messages: 'Mesajlar', noMessages: 'Hələ mesaj yoxdur', msgPh: 'Mesaj yazın...', send: 'Göndər', sendFail: 'Göndərilmədi',
        backLink: '← Yeni sorğu göndər',
        statuses: {
          'Not started': { label: 'Başlanmayıb', cls: 'not-started', icon: '○' },
          'In progress': { label: 'İcrada',      cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'Yoxlanılır',  cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Tamamlandı',  cls: 'done',        icon: '●' },
          'On Hold':     { label: 'Gözləmədə',   cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Ləğv edildi', cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: '🔴 Yüksək', Medium: '🟡 Orta', Low: '🟢 Aşağı' },
      },
      en: {
        loading: 'Loading...', errorNoId: 'Tracking ID not found', errorNotFound: 'Request not found', errorConn: 'Connection error',
        priority: 'Priority', dueDate: 'Due date', submitted: 'Submitted',
        messages: 'Messages', noMessages: 'No messages yet', msgPh: 'Type a message...', send: 'Send', sendFail: 'Failed to send',
        backLink: '← Submit new request',
        statuses: {
          'Not started': { label: 'Not started', cls: 'not-started', icon: '○' },
          'In progress': { label: 'In progress', cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'In review',   cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Done',         cls: 'done',        icon: '●' },
          'On Hold':     { label: 'On hold',      cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Cancelled',    cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: '🔴 High', Medium: '🟡 Medium', Low: '🟢 Low' },
      },
      ru: {
        loading: 'Загрузка...', errorNoId: 'ID отслеживания не найден', errorNotFound: 'Запрос не найден', errorConn: 'Ошибка соединения',
        priority: 'Приоритет', dueDate: 'Срок', submitted: 'Отправлено',
        messages: 'Сообщения', noMessages: 'Сообщений пока нет', msgPh: 'Напишите сообщение...', send: 'Отправить', sendFail: 'Не отправлено',
        backLink: '← Новый запрос',
        statuses: {
          'Not started': { label: 'Не начато',      cls: 'not-started', icon: '○' },
          'In progress': { label: 'В процессе',     cls: 'in-progress', icon: '◑' },
          'In Review':   { label: 'На проверке',    cls: 'in-progress', icon: '◑' },
          'Done':        { label: 'Завершено',       cls: 'done',        icon: '●' },
          'On Hold':     { label: 'Приостановлено', cls: 'on-hold',     icon: '◌' },
          'Cancelled':   { label: 'Отменено',       cls: 'cancelled',   icon: '✕' },
        },
        priorities: { High: '🔴 Высокий', Medium: '🟡 Средний', Low: '🟢 Низкий' },
      },
    };

    function tr(key) { return (T[lang] || T.az)[key] ?? T.az[key]; }

    function loadGoogleTranslate(cb) {
      if (window._gtReady) { cb(); return; }
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'gTranslate');
        window._gtReady = true;
        cb();
      };
      const s = document.createElement('script');
      s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.head.appendChild(s);
    }

    function applyGoogleTranslate(target) {
      loadGoogleTranslate(() => {
        const trySet = (n) => {
          const combo = document.querySelector('select.goog-te-combo');
          if (combo) { combo.value = target; combo.dispatchEvent(new Event('change')); }
          else if (n > 0) setTimeout(() => trySet(n - 1), 200);
        };
        trySet(15);
      });
    }

    function resetGoogleTranslate() {
      const combo = document.querySelector('select.goog-te-combo');
      if (combo) { combo.value = ''; combo.dispatchEvent(new Event('change')); }
    }

    function setLang(l) {
      uiLang = l;
      lang = NATIVE_LANGS.has(l) ? l : 'en';
      localStorage.setItem('sp-lang', l);
      applyLang();
      if (cachedStatus) renderStatus(cachedStatus);
      if (cachedComments !== null) renderComments();
      if (NATIVE_LANGS.has(l)) resetGoogleTranslate();
      else applyGoogleTranslate(gtCode(l));
    }

    function applyLang() {
      document.getElementById('langSel').value = uiLang;
      document.getElementById('sectionMessages').textContent = tr('messages');
      document.getElementById('msgInput').placeholder = tr('msgPh');
      document.getElementById('sendBtn').textContent = tr('send');
      document.getElementById('backLinkEl').textContent = tr('backLink');
      const nm = document.getElementById('noMsgEl');
      if (nm) nm.textContent = tr('noMessages');
    }

    function populateLangOptions() {
      const sel = document.getElementById('langSel');
      sel.innerHTML = '';
      LANGUAGES.forEach(({ code, name }) => {
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      sel.value = uiLang;
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sp-theme', next);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('sp-theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      }
    });

    const priorityCls = { High: 'var(--red)', Medium: 'var(--yellow)', Low: 'var(--green)' };

    function formatDate(d) {
      if (!d) return null;
      return new Date(d).toLocaleDateString('az-AZ', { day:'2-digit', month:'2-digit', year:'numeric' });
    }

    function formatTime(d) {
      if (!d) return '';
      return new Date(d).toLocaleTimeString('az-AZ', { hour:'2-digit', minute:'2-digit' });
    }

    function renderStatus(data) {
      const card = document.getElementById('statusCard');
      const statuses = tr('statuses');
      const st = statuses[data.status] || { label: data.status, cls: 'not-started', icon: '○' };
      const pLabels = tr('priorities');
      card.innerHTML =
        '<div class="task-title">' + escHtml(data.taskName) + '</div>' +
        '<div class="status-badge ' + st.cls + '">' + st.icon + ' ' + st.label + '</div>' +
        '<div class="divider"></div>' +
        (data.priority ? '<div class="meta"><span class="meta-label">' + tr('priority') + '</span><span style="color:' + (priorityCls[data.priority] || 'var(--text)') + '">' + (pLabels[data.priority] || data.priority) + '</span></div>' : '') +
        (data.dueDate ? '<div class="meta"><span class="meta-label">' + tr('dueDate') + '</span><span>' + formatDate(data.dueDate) + '</span></div>' : '') +
        '<div class="meta"><span class="meta-label">' + tr('submitted') + '</span><span>' + formatDate(data.createdTime) + '</span></div>';
    }

    async function loadStatus() {
      const card = document.getElementById('statusCard');
      if (!trackingId) { card.innerHTML = '<div class="error-state">' + tr('errorNoId') + '</div>'; return; }

      try {
        const res = await fetch('/api/track?id=' + trackingId);
        const data = await res.json();

        if (!data.success) { card.innerHTML = '<div class="error-state">' + (data.error || tr('errorNotFound')) + '</div>'; return; }

        cachedStatus = data;
        renderStatus(data);

        document.getElementById('chatCard').style.display = 'block';
        document.getElementById('trackingIdLabel').style.display = 'block';
        document.getElementById('trackingIdLabel').textContent = 'ID: ' + trackingId;

        loadComments();
        setInterval(loadComments, 3000);
        setInterval(loadStatus, 30000);
      } catch (err) {
        card.innerHTML = '<div class="error-state">' + tr('errorConn') + '</div>';
      }
    }

    function renderComments() {
      const container = document.getElementById('messages');
      if (!container) return;
      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;

      if (!cachedComments || cachedComments.length === 0) {
        container.innerHTML = '<div class="no-messages">' + tr('noMessages') + '</div>';
      } else {
        container.innerHTML = cachedComments.map(c =>
          '<div class="msg-row ' + (c.isUser ? 'mine' : 'theirs') + '">' +
          (!c.isUser ? '<span class="msg-meta msg-who">Support</span>' : '') +
          '<div class="bubble ' + (c.isUser ? 'mine' : 'theirs') + '">' + escHtml(c.text) + '</div>' +
          '<span class="msg-meta">' + formatTime(c.time) + '</span>' +
          '</div>'
        ).join('');
        if (wasAtBottom || lastCommentCount === -1) container.scrollTop = container.scrollHeight;
      }
    }

    async function loadComments() {
      try {
        const res = await fetch('/api/comments?id=' + trackingId);
        const data = await res.json();
        if (!data.success) return;

        const count = data.comments?.length || 0;
        if (count === lastCommentCount) return;

        cachedComments = data.comments || [];
        lastCommentCount = count;
        renderComments();
      } catch {}
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const btn = document.getElementById('sendBtn');
      const errEl = document.getElementById('sendError');
      const text = input.value.trim();

      if (!text) return;

      btn.disabled = true;
      errEl.classList.remove('visible');

      try {
        const res = await fetch('/api/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trackingId, message: text })
        });

        const data = await res.json();

        if (data.success) {
          input.value = '';
          lastCommentCount = -1;
          cachedComments = null;
          await loadComments();
        } else {
          errEl.textContent = data.error || tr('sendFail');
          errEl.classList.add('visible');
        }
      } catch (err) {
        errEl.textContent = tr('errorConn');
        errEl.classList.add('visible');
      }

      btn.disabled = false;
      input.focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    populateLangOptions();
    applyLang();
    if (!NATIVE_LANGS.has(uiLang)) applyGoogleTranslate(gtCode(uiLang));
    loadStatus();
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
