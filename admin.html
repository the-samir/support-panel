<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Support Panel</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script>
    (function() {
      var saved = localStorage.getItem('sp-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f; --surface: #171717; --border: #262626;
      --border-hover: #333; --text: #e8e8e8; --muted: #666;
      --green: #4ade80; --red: #f87171; --yellow: #fbbf24; --blue: #60a5fa;
    }
    [data-theme="light"] {
      --bg: #f5f5f3; --surface: #ffffff; --border: #e0e0da;
      --border-hover: #c8c8c0; --text: #1a1a1a; --muted: #999;
      --green: #16a34a; --red: #dc2626; --yellow: #d97706; --blue: #2563eb;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem 4rem; }
    .wrap { width: 100%; max-width: 880px; margin: 0 auto; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .logo-text { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .admin-badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .logo-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .user-name { font-size: 13px; color: var(--muted); }
    .theme-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 3px 8px; font-size: 14px; line-height: 1; transition: color .15s, border-color .15s; }
    .theme-btn:hover { color: var(--text); border-color: var(--border-hover); }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }
    .signout-btn { background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; padding: 0; transition: color .15s; }
    .signout-btn:hover { color: var(--text); }

    /* Auth */
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; text-align: center; margin-top: 1rem; }
    .auth-card h2 { font-weight: 400; font-size: 20px; margin-bottom: .5rem; }
    .auth-card p { font-size: 14px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .auth-btn { padding: 10px 28px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
    .auth-btn:hover { opacity: .88; }

    .state-msg { text-align: center; padding: 3rem 0; color: var(--muted); font-size: 14px; }

    /* Filters */
    .filters { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .chip { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .chip:hover { border-color: var(--border-hover); color: var(--text); }
    .chip.active { border-color: var(--text); color: var(--text); background: rgba(255,255,255,.05); }
    [data-theme="light"] .chip.active { background: rgba(0,0,0,.04); }

    .filter-select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 10px; outline: none; cursor: pointer; transition: border-color .15s; }
    .filter-select:focus { border-color: var(--border-hover); }

/* Search & date filters */
    .filters-row2 { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 160px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px;
      padding: 5px 11px; outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--border-hover); }
    .search-input::placeholder { color: var(--muted); }
    .flatpickr-input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px;
      padding: 5px 11px; outline: none; cursor: pointer; transition: border-color .15s;
      width: 110px;
    }
    .flatpickr-input:focus { border-color: var(--border-hover); }
    .flatpickr-input::placeholder { color: var(--muted); }
    .flatpickr-calendar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3); font-family: 'DM Sans', sans-serif;
      padding: 8px; width: 272px;
    }
    .flatpickr-calendar.arrowTop:before, .flatpickr-calendar.arrowTop:after,
    .flatpickr-calendar.arrowBottom:before, .flatpickr-calendar.arrowBottom:after { display: none; }
    .flatpickr-months { padding: 2px 0 6px; }
    .flatpickr-months .flatpickr-month { background: transparent; color: var(--text); fill: var(--text); height: 32px; }
    .flatpickr-current-month { font-size: 13px; padding-top: 5px; }
    .flatpickr-current-month .flatpickr-monthDropdown-months { background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; border: none; outline: none; }
    .flatpickr-current-month input.cur-year { color: var(--text); font-family: 'DM Mono', monospace; }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--muted); }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--text); }
    .flatpickr-weekdays { background: transparent; margin-bottom: 2px; }
    span.flatpickr-weekday { background: transparent; color: var(--muted); font-size: 11px; }
    .flatpickr-days { border: none; }
    .dayContainer { padding: 0; min-width: unset; max-width: unset; width: 100%; }
    .flatpickr-day { color: var(--text); border-radius: 6px; height: 34px; line-height: 34px; font-size: 13px; border: 1px solid transparent; max-width: unset; flex-basis: calc(100% / 7); }
    .flatpickr-day:hover { background: var(--bg); border-color: transparent; }
    .flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--text); color: var(--bg); border-color: transparent; }
    .flatpickr-day.today { border-color: var(--border-hover); }
    .flatpickr-day.today.selected { border-color: transparent; }
    .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--border); }
    .flatpickr-day.flatpickr-disabled { color: var(--border); opacity: .4; }
    .numInputWrapper span { border-color: var(--border); }
    .numInputWrapper span:after { border-top-color: var(--muted); border-bottom-color: var(--muted); }
    .numInputWrapper:hover { background: var(--bg); }
    .date-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .clear-dates { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 2px; transition: color .15s; }
    .clear-dates:hover { color: var(--text); }

    .task-count { font-size: 12px; color: var(--muted); margin-bottom: .75rem; }

    /* Task items */
    .task-list { display: flex; flex-direction: column; gap: .5rem; }

    .task-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .875rem 1.125rem; transition: border-color .15s; }
    .task-item:hover { border-color: var(--border-hover); }
    .task-item.has-unread { border-left: 3px solid var(--red); padding-left: calc(1.125rem - 2px); }

    .task-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: .5rem; }
    .task-name { flex: 1; font-size: 14px; line-height: 1.4; min-width: 0; }
    .task-name a { color: inherit; text-decoration: none; }
    .task-name a:hover { text-decoration: underline; }

    .task-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .meta-text { font-size: 12px; color: var(--muted); }

    .priority-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
    .priority-dot span { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .tag-chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; }
    .unread-dot { font-size: 11px; color: var(--red); font-weight: 500; }

    /* Custom status dropdown */
    .csd { position: relative; display: inline-block; flex-shrink: 0; }
    .csd-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
      font-family: 'DM Sans', sans-serif; cursor: pointer; border: 1px solid; user-select: none;
      transition: opacity .15s; white-space: nowrap;
    }
    .csd-btn:hover { opacity: .82; }
    .csd-btn svg { flex-shrink: 0; }
    .csd-btn.not-started { background: rgba(128,128,128,.06); color: var(--muted); border-color: var(--border); }
    .csd-btn.in-progress { background: rgba(96,165,250,.1); color: var(--blue); border-color: rgba(96,165,250,.3); }
    .csd-btn.in-review   { background: rgba(96,165,250,.1); color: var(--blue); border-color: rgba(96,165,250,.3); }
    .csd-btn.done        { background: rgba(74,222,128,.1); color: var(--green); border-color: rgba(74,222,128,.3); }
    .csd-btn.on-hold     { background: rgba(128,128,128,.04); color: var(--muted); border-color: var(--border); }
    .csd-btn.cancelled   { background: rgba(248,113,113,.08); color: var(--red); border-color: rgba(248,113,113,.2); }

    .csd-list {
      display: none; position: absolute; top: calc(100% + 5px); right: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; z-index: 100; min-width: 155px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .csd-list.open { display: block; }
    .csd-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 13px; font-size: 12px; cursor: pointer;
      transition: background .1s; font-family: 'DM Sans', sans-serif; white-space: nowrap;
    }
    .csd-opt:hover { background: rgba(255,255,255,.05); }
    [data-theme="light"] .csd-opt:hover { background: rgba(0,0,0,.04); }
    .csd-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .d-not-started, .d-on-hold { background: var(--muted); }
    .d-in-progress, .d-in-review { background: var(--blue); }
    .d-done { background: var(--green); }
    .d-cancelled { background: var(--red); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Support Panel</span>
      <span class="admin-badge">Admin</span>
      <div class="logo-right">
        <button class="theme-btn" onclick="toggleTheme()">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">☽</span>
        </button>
        <span class="user-name" id="userNameEl" style="display:none"></span>
        <button class="signout-btn" id="signoutBtn" style="display:none" onclick="window._clerk && window._clerk.signOut()">Çıxış</button>
      </div>
    </div>

    <div id="loadingState" class="state-msg">Yüklənir...</div>

    <div class="auth-card" id="authCard" style="display:none">
      <h2>Admin girişi</h2>
      <p>Admin panelə daxil olmaq üçün hesabınıza giriş edin.</p>
      <button class="auth-btn" onclick="window._clerk && window._clerk.openSignIn()">Giriş et →</button>
    </div>

    <div class="auth-card" id="deniedCard" style="display:none">
      <h2>İcazəniz yoxdur</h2>
      <p>Bu panel yalnız adminlərə açıqdır.</p>
    </div>

    <div id="mainContent" style="display:none">
      <div class="filters">
        <div class="filter-chips">
          <button class="chip active" onclick="setStatus(this, '')">Hamısı</button>
          <button class="chip" onclick="setStatus(this, 'Not started')">Başlanmayıb</button>
          <button class="chip" onclick="setStatus(this, 'In progress')">İcrada</button>
          <button class="chip" onclick="setStatus(this, 'In Review')">Yoxlanılır</button>
          <button class="chip" onclick="setStatus(this, 'On Hold')">Gözləmədə</button>
          <button class="chip" onclick="setStatus(this, 'Done')">Tamamlandı</button>
          <button class="chip" onclick="setStatus(this, 'Cancelled')">Ləğv edildi</button>
        </div>
        <select class="filter-select" id="priorityFilter" onchange="applyFilters()">
          <option value="">Bütün prioritetlər</option>
          <option value="High">Yüksək</option>
          <option value="Medium">Orta</option>
          <option value="Low">Aşağı</option>
        </select>
      </div>

      <div class="filters-row2">
        <input class="search-input" id="searchInput" placeholder="Ad və ya Tracking ID ilə axtar..." oninput="applyFilters()" />
        <span class="date-label">Yaradılma tarixi:</span>
        <input id="dateFrom" type="text" placeholder="dd/mm/yyyy" readonly />
        <span class="date-label">—</span>
        <input id="dateTo" type="text" placeholder="dd/mm/yyyy" readonly />
        <button class="clear-dates" onclick="clearDates()" title="Tarixi sıfırla">✕</button>
      </div>

      <div class="task-count" id="taskCount"></div>
      <div class="task-list" id="taskList"></div>
    </div>
  </div>

  <script>
    const statusMap = {
      'Not started': { label: 'Başlanmayıb', cls: 'not-started' },
      'In progress': { label: 'İcrada',      cls: 'in-progress' },
      'In Review':   { label: 'Yoxlanılır',  cls: 'in-review'   },
      'Done':        { label: 'Tamamlandı',  cls: 'done'        },
      'On Hold':     { label: 'Gözləmədə',   cls: 'on-hold'     },
      'Cancelled':   { label: 'Ləğv edildi', cls: 'cancelled'   },
    };
    const statusOrder = ['Not started', 'On Hold', 'In progress', 'In Review', 'Done', 'Cancelled'];
    const statusSortOrder = { 'Not started': 0, 'On Hold': 1, 'In progress': 2, 'In Review': 3, 'Done': 4, 'Cancelled': 5 };
    const priorityColors = { High: 'var(--red)', Medium: 'var(--yellow)', Low: 'var(--green)' };
    const priorityLabels = { High: 'Yüksək', Medium: 'Orta', Low: 'Aşağı' };

    let currentStatus = '';
    let allTasks = [];
    let authToken = '';
    const unreadSet = new Set();

    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sp-theme', next);
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('sp-theme')) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    });

    function esc(t) {
      return String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('az-AZ', { day:'2-digit', month:'2-digit', year:'numeric' });
    }

    const dotCls = { 'Not started':'d-not-started','On Hold':'d-on-hold','In progress':'d-in-progress','In Review':'d-in-review','Done':'d-done','Cancelled':'d-cancelled' };

    function statusSelectHtml(current, pageId) {
      const cls = statusMap[current]?.cls || 'not-started';
      const opts = statusOrder.filter(s => s !== current).map(s =>
        `<div class="csd-opt" onclick="selectCsdStatus('${esc(pageId)}','${s}')">` +
        `<span class="csd-dot ${dotCls[s] || 'd-not-started'}"></span>${statusMap[s]?.label || s}</div>`
      ).join('');
      return `<div class="csd" id="csd-${esc(pageId)}">` +
        `<div class="csd-btn ${cls}" onclick="toggleCsd('${esc(pageId)}')">` +
          `${statusMap[current]?.label || current}` +
          `<svg width="9" height="5" viewBox="0 0 9 5" fill="currentColor" opacity=".5"><path d="M0 0l4.5 5L9 0z"/></svg>` +
        `</div>` +
        `<div class="csd-list" id="csdl-${esc(pageId)}">${opts}</div>` +
      `</div>`;
    }

    function toggleCsd(pageId) {
      const list = document.getElementById('csdl-' + pageId);
      const isOpen = list?.classList.contains('open');
      document.querySelectorAll('.csd-list.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) list?.classList.add('open');
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.csd')) {
        document.querySelectorAll('.csd-list.open').forEach(el => el.classList.remove('open'));
      }
    });

    async function selectCsdStatus(pageId, status) {
      document.getElementById('csdl-' + pageId)?.classList.remove('open');
      const cls = statusMap[status]?.cls || 'not-started';
      const btn = document.querySelector(`#csd-${pageId} .csd-btn`);
      if (btn) {
        btn.className = 'csd-btn ' + cls;
        btn.innerHTML = `${statusMap[status]?.label || status}<svg width="9" height="5" viewBox="0 0 9 5" fill="currentColor" opacity=".5"><path d="M0 0l4.5 5L9 0z"/></svg>`;
        const opts = statusOrder.filter(s => s !== status).map(s =>
          `<div class="csd-opt" onclick="selectCsdStatus('${esc(pageId)}','${s}')">` +
          `<span class="csd-dot ${dotCls[s] || 'd-not-started'}"></span>${statusMap[s]?.label || s}</div>`
        ).join('');
        document.getElementById('csdl-' + pageId).innerHTML = opts;
      }
      const task = allTasks.find(t => t.pageId === pageId);
      if (task) task.status = status;
      try {
        const res = await fetch('/api/admin-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify({ pageId, status })
        });
        const data = await res.json();
        if (!data.success) alert('Xəta: ' + (data.error || 'Bilinməyən xəta'));
      } catch { alert('Bağlantı xətası'); }
    }

    function applyUnread() {
      unreadSet.forEach(pageId => {
        const el = document.getElementById('ti-' + pageId);
        const badge = document.getElementById('ub-' + pageId);
        if (el) el.classList.add('has-unread');
        if (badge && !badge.innerHTML) badge.innerHTML = '<span class="unread-dot">● Cavabsız mesaj</span>';
      });
    }

    function renderTasks(tasks) {
      document.getElementById('taskCount').textContent = tasks.length + ' sorğu';
      const list = document.getElementById('taskList');

      if (!tasks.length) {
        list.innerHTML = '<div class="state-msg">Sorğu tapılmadı</div>';
        return;
      }

      list.innerHTML = tasks.map(t => {
        const trackHref = t.trackingId ? `/admin-track?id=${esc(t.trackingId)}` : '#';
        const priorityHtml = t.priority
          ? `<span class="priority-dot"><span style="background:${priorityColors[t.priority]}"></span>${esc(priorityLabels[t.priority])}</span>`
          : '';
        const tagsHtml = (t.tags || []).map(tag => `<span class="tag-chip">${esc(tag)}</span>`).join('');
        const requesterHtml = t.requester ? `<span class="meta-text">${esc(t.requester)}</span><span class="meta-text">·</span>` : '';
        const dateHtml = t.createdTime ? `<span class="meta-text">${formatDate(t.createdTime)}</span>` : '';

        return `
          <div class="task-item" id="ti-${esc(t.pageId)}">
            <div class="task-top">
              <span class="task-name">
                <a href="${trackHref}" target="_blank">${esc(t.taskName)}</a>
              </span>
              ${statusSelectHtml(t.status, t.pageId)}
            </div>
            <div class="task-meta">
              ${requesterHtml}
              ${priorityHtml}
              ${dateHtml}
              ${tagsHtml}
              <span id="ub-${esc(t.pageId)}"></span>
            </div>
          </div>`;
      }).join('');
      applyUnread();
    }

    function setStatus(btn, status) {
      currentStatus = status;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function clearDates() {
      document.getElementById('dateFrom')._flatpickr?.clear();
      document.getElementById('dateTo')._flatpickr?.clear();
      applyFilters();
    }

    function applyFilters() {
      const priority = document.getElementById('priorityFilter').value;
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;

      let filtered = allTasks;
      if (currentStatus) filtered = filtered.filter(t => t.status === currentStatus);
      if (priority) filtered = filtered.filter(t => t.priority === priority);
      if (search) filtered = filtered.filter(t =>
        (t.taskName || '').toLowerCase().includes(search) ||
        (t.trackingId || '').toLowerCase().includes(search) ||
        (t.requester || '').toLowerCase().includes(search)
      );
      if (dateFrom) filtered = filtered.filter(t => t.createdTime && t.createdTime.slice(0, 10) >= dateFrom);
      if (dateTo) filtered = filtered.filter(t => t.createdTime && t.createdTime.slice(0, 10) <= dateTo);

      filtered = [...filtered].sort((a, b) => {
        const diff = (statusSortOrder[a.status] ?? 99) - (statusSortOrder[b.status] ?? 99);
        if (diff !== 0) return diff;
        return new Date(b.createdTime) - new Date(a.createdTime);
      });

      renderTasks(filtered);
    }


    async function checkUnread() {
      const visibleIds = Array.from(document.querySelectorAll('.task-item'))
        .map(el => {
          const id = el.id.replace('ti-', '');
          return allTasks.find(t => t.pageId === id)?.trackingId;
        }).filter(Boolean);

      await Promise.all(visibleIds.map(async trackingId => {
        try {
          const res = await fetch('/api/comments?id=' + trackingId);
          const data = await res.json();
          const task = allTasks.find(t => t.trackingId === trackingId);
          if (!task || !data.success) return;
          const el = document.getElementById('ti-' + task.pageId);
          const badge = document.getElementById('ub-' + task.pageId);
          if (!el || !badge) return;
          const comments = data.comments || [];
          const last = comments[comments.length - 1];
          if (last?.isUser) {
            unreadSet.add(task.pageId);
            if (el) { el.classList.add('has-unread'); }
            if (badge) badge.innerHTML = '<span class="unread-dot">● Cavabsız mesaj</span>';
          } else {
            unreadSet.delete(task.pageId);
            if (el) el.classList.remove('has-unread');
            if (badge) badge.innerHTML = comments.length ? `<span class="meta-text">${comments.length} mesaj</span>` : '';
          }
        } catch {}
      }));

    }

    async function loadTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '<div class="state-msg">Yüklənir...</div>';
      try {
        const res = await fetch('/api/admin-tasks', {
          headers: { 'Authorization': 'Bearer ' + authToken }
        });
        const data = await res.json();
        if (res.status === 401) { showAuthCard(); return; }
        if (res.status === 403) {
          document.getElementById('mainContent').style.display = 'none';
          document.getElementById('deniedCard').style.display = 'block';
          return;
        }
        if (!data.success) {
          list.innerHTML = `<div class="state-msg">Xəta: ${esc(data.error || 'Yüklənmədi')}</div>`;
          return;
        }
        allTasks = data.tasks;
        applyFilters();
        checkUnread();
      } catch {
        list.innerHTML = '<div class="state-msg">Bağlantı xətası</div>';
      }
    }

    function showAuthCard() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('authCard').style.display = 'block';
    }

    async function onSignedIn(user, clerk) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('userNameEl').style.display = '';
      document.getElementById('signoutBtn').style.display = '';
      document.getElementById('userNameEl').textContent = user.fullName || user.primaryEmailAddress?.emailAddress || '';
      authToken = await clerk.session.getToken();
      await loadTasks();
    }

    function loadScript(src, pk) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        if (pk) s.setAttribute('data-clerk-publishable-key', pk);
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    (async () => {
      try {
        const { publishableKey } = await fetch('/api/config').then(r => r.json());
        if (!publishableKey) { showAuthCard(); return; }

        const b64 = publishableKey.replace(/^pk_(test|live)_/, '');
        const frontendApi = 'https://' + atob(b64).replace(/\$$/, '');
        await loadScript(`${frontendApi}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`, publishableKey);

        const clerk = await new Promise((resolve, reject) => {
          if (window.Clerk) return resolve(window.Clerk);
          window.addEventListener('clerk:load', () => resolve(window.Clerk), { once: true });
          setTimeout(() => reject(new Error('timeout')), 8000);
        });

        if (!clerk.loaded) await clerk.load();
        window._clerk = clerk;

        if (clerk.user) await onSignedIn(clerk.user, clerk);
        else showAuthCard();

        clerk.addListener(({ user }) => {
          if (user) onSignedIn(user, clerk);
          else showAuthCard();
        });
      } catch {
        showAuthCard();
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

    const fpConfig = {
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd/m/Y',
      disableMobile: true,
      onChange: () => applyFilters()
    };
    flatpickr('#dateFrom', fpConfig);
    flatpickr('#dateTo', fpConfig);
  </script>
</body>
